[build]
  command = "pnpm build"
  publish = "dist"
  node_bundler = "pnpm"

[build.environment]
  NODE_VERSION = "18"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[context.production]
  command = "pnpm build"
  publish = "dist"

[context.deploy-preview]
  command = "pnpm build"
  publish = "dist"

[context.branch-deploy]
  command = "pnpm build"
  publish = "dist"
